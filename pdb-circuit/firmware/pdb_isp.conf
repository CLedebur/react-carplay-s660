# avrdude programmer for the S660-PDB: the Pi's own GPIO lines on J3 / J103
# (PDB reference §9.4). Loaded by the Makefile with `avrdude -C +pdb_isp.conf`.
# Needs avrdude built with libgpiod (Debian's 7.1 package lacks linuxgpio; see README).
# Pin numbers are BCM GPIO numbers = line offsets on /dev/gpiochip0.
programmer
    id              = "pdb_isp";
    desc            = "S660-PDB ISP via Pi GPIO (J103)";
    type            = "linuxgpio";
    prog_modes      = PM_ISP;
    connection_type = linuxgpio;
    reset           = 13;
    sck             = 26;
    sdo             = 5;
    sdi             = 6;
;
