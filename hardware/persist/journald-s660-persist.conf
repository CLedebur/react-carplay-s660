# /etc/systemd/journald.conf.d/s660-persist.conf (BUILD_NOTES §31)
# The journal lives on the /persist partition (bind-mounted onto /var/log/journal via
# fstab), so it survives both the overlay and the ignition cutting power.
[Journal]
Storage=persistent
# Default is 5 min: an ignition-off would lose the end of every drive. 5 s bounds the loss
# to the last few seconds; NVMe write volume at this rate is negligible.
SyncIntervalSec=5s
SystemMaxUse=4G
SystemKeepFree=8G
