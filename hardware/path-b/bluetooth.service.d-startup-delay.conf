[Service]
# Chromium asks D-Bus for BlueZ before bluetooth-late.timer fires. Enforce the
# boot-relative delay for that activation path too; later restarts do not sleep.
# @BLUETOOTH_DELAY_SEC@ is substituted by provision.sh from the same BLUETOOTH_DELAY_SEC
# config value bluetooth-late.timer's OnBootSec= uses -- one source of truth for both.
ExecStartPre=/usr/bin/python3 -c "import time; time.sleep(max(0, @BLUETOOTH_DELAY_SEC@ - time.clock_gettime(time.CLOCK_BOOTTIME)))"
# If the ExecStartPre step (or the daemon itself) fails once, retry rather than leaving
# Bluetooth -- and the trackpad, the only input device on this unit -- dead for the rest
# of the boot with no automatic recovery.
Restart=on-failure
RestartSec=2
